<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zomato Restaurant Card</title>
    <style>
    .restaurant-card{
            height: 300px;
            width: 300px;
            border: 5px solid;
            border-radius: 20px;
            margin: 100px;
            padding: 10px;
            background-color: rgb(248, 252, 153);
            display: inline-block;
        }
        h2 ,h3{
           text-align: center;
        }
        
        
        li{
            list-style-type: none;
           
        }
    </style>
</head>
<body>
    <div class="restaurant-card">
        
            <h2>lapino's Pizza</h2>
            
            <ul>
                <li>Cheese & Herb Pizza</li>
                <li>Tomatoes Pizza</li>
                <li>Garlic-bread Pizza </li>
            </ul>  

            <h3>Rating: 4.5/5</h3>  
        
    </div>
     <div style="background-color: rgb(255, 191, 221);" class="restaurant-card">
        
            <h2 >Tea Post</h2>
             <ul>
                <li>Tea </li>
                <li>Coffee</li>
                <li>Sandwich</li>
            </ul> 

            <h3>Rating: 4.0/5</h3>  
        
    </div>
</body>
</html>
