<!DOCTYPE html>
<html>
<head>
<title>Zomato Card</title>

<style>

.common-box{
    margin: 20px;
    padding: 20px;
    border: 2px solid gray;
}



.restaurant-card{
    width: 300px;
    border-radius: 15px;
}

.offer{
    background-color: red;
    color: white;
}

</style>

</head>

<body>

<div class="restaurant-card common-box">

    <h2>Jalaram Kathiyawadi</h2>

    <p class="common-box">
        Gujarati Thali, Punjabi Food
    </p>

    <h3 class="offer common-box">
        Rating: 4.5/5
    </h3>

</div>

</body>
</html>
