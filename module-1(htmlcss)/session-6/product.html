<!DOCTYPE html>
<html>
<head>
    <title>Flipkart Product Tile</title>

    <style>

        .product-card{
            width: 250px;
            border: 2px solid gray;
            padding: 20px;
            border-radius: 20px;
            
        }

        img{
            width: 200px;
            height: 200px;
        }

        .product-name{
            display: block;
            font-size: 25px;
            font-weight: bold;
        }

        .price{
            display: inline-block;
            color: rgb(247, 97, 56);
            font-size: 20px;
        }

        .hide-price{
            display:none;
        }

    </style>

</head>

<body>

<div class="product-card">

    <img src="/session-4/laptop.jpg" alt="laptop">

    <div class="product-name">
       dell laptop
    </div>

    <div class="price hide-price">
        ₹50,000
    </div>

</div>


</body>
</html>
