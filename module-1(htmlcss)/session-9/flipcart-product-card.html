<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flipkart Product Cards</title>

   
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background-color:#f1f3f6;
        }

        .card{
            transition:0.3s;
        }

        .card:hover{
            transform:scale(1.03);
            box-shadow:0 4px 15px rgba(0,0,0,0.2);
        }

        .card img{
            height:220px;
            object-fit:contain;
            padding:15px;
        }

        .price{
            color:green;
            font-size:20px;
            font-weight:bold;
        }

        .btn-buy{
            width:100%;
        }
    </style>
</head>
<body>

<div class="container my-5">

    <div class="row">

        
        <div class="col-md-4 mb-4">
            <div class="card">
                <img src="teddy.jpg" class="card-img-top" alt="Product">
                <div class="card-body">
                    <h5 class="card-title">Strawberry Rabbit</h5>
                    <p class="price">₹399</p>
                    <p class="card-text">
                       RSS SOFT TOYS Adorable Strawberry Rabbit , Cute Bunny Soft Toy.
                    </p>
                    <button class="btn btn-warning btn-buy">
                        Add to Cart
                    </button>
                </div>
            </div>
        </div>

        
        <div class="col-md-4 mb-4">
            <div class="card">
                <img src="teddy2.jpg" class="card-img-top" alt="Product">
                <div class="card-body">
                    <h5 class="card-title"> Teddy Bear</h5>
                    <p class="price">₹1399</p>
                    <p class="card-text">
                       SOFT TOYS Adorable teddy bear , Cute Bunny Soft Toy.
                    </p>
                    <button class="btn btn-warning btn-buy">
                        Add to Cart
                    </button>
                </div>
            </div>
        </div>

        
        <div class="col-md-4 mb-4">
            <div class="card">
                <img src="teddy3.jpg" class="card-img-top" alt="Product">
                <div class="card-body">
                    <h5 class="card-title">soft toy</h5>
                    <p class="price">₹899</p>
                    <p class="card-text">
                        SOFT TOYS Adorable soft taddy bear , Cute Bunny Soft Toy.
                    </p>
                    <button class="btn btn-warning btn-buy">
                        Add to Cart
                    </button>
                </div>
            </div>
        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
