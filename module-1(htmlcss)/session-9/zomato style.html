<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zomato Restaurant Listing</title>

  
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background-color:#f8f9fa;
        }

        .card{
            transition:0.3s;
        }

        .card:hover{
            transform:scale(1.03);
            box-shadow:0 4px 10px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

<div class="container mt-5">

    <h2 class="text-center mb-4">Zomato Restaurant Listing</h2>

    <div class="row">

        
        <div class="col-6 mb-4">
            <div class="card">
                <div class="card-body">
                    <h4 class="card-title">Spice Villa</h4>
                    <p class="card-text">
                        Delicious North Indian and Chinese food with fast service.
                    </p>
                </div>
            </div>
        </div>

        
        <div class="col-6 mb-4">
            <div class="card">
                <div class="card-body">
                    <h4 class="card-title">Pizza Hub</h4>
                    <p class="card-text">
                        Fresh pizzas, burgers, and cold beverages.
                    </p>
                </div>
            </div>
        </div>

        
        <div class="col-6 mb-4">
            <div class="card">
                <div class="card-body">
                    <h4 class="card-title">Food Palace</h4>
                    <p class="card-text">
                        Famous for Gujarati Thali and South Indian dishes.
                    </p>
                </div>
            </div>
        </div>

        
        <div class="col-6 mb-4">
            <div class="card">
                <div class="card-body">
                    <h4 class="card-title">Royal Kitchen</h4>
                    <p class="card-text">
                        Authentic Punjabi cuisine with family-friendly dining.
                    </p>
                </div>
            </div>
        </div>

    </div>

</div>

</body>
</html>
