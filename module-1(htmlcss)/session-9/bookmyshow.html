<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookMyShow Movie Details</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background-color:#f5f5f5;
        }

        .movie-card{
            background:white;
            border-radius:10px;
            padding:20px;
            box-shadow:0 4px 10px rgba(0,0,0,0.2);
            margin-top:40px;
        }

        .movie-card img{
            width:100%;
            border-radius:10px;
        }

        .rating{
            color:green;
            font-weight:bold;
            font-size:20px;
        }
    </style>
</head>
<body>

<div class="container">

    <div class="movie-card">

        <div class="row">
            
            <div class="col-md-4">
                <img src="movie-2.jpg" alt="Movie Poster">
            </div>

            
            <div class="col-md-8">

                <h2>Avengers: Endgame</h2>

                <p><strong>Genre:</strong> Action, Adventure, Sci-Fi</p>

                <p class="rating">⭐ 9.2/10</p>

                <p>
                    After the devastating events of Infinity War,
                    the Avengers assemble once again to reverse
                    Thanos' actions and restore balance to the universe.
                </p>

                <button class="btn btn-danger">
                    Book Now
                </button>

            </div>

        </div>

    </div>

</div>

</body>
</html>
