<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flipkart Product Showcase</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <h2 class="text-center mb-4">Featured Products</h2>
    <div class="row g-4">
        <div class="col-md-3 col-6">
            <div class="card h-100 shadow">
                <img src="watch.jpg" class="card-img-top" alt="Product">
                <div class="card-body text-center">
                    <h5 class="card-title">Smart Watch</h5>
                    <p class="text-success fw-bold">₹1,999</p>
                    <button class="btn btn-primary">Buy Now</button>
                </div>
            </div>
        </div>
     
        <div class="col-md-3 col-6">
            <div class="card h-100 shadow">
                <img src="blutooth-speacker.jpg" class="card-img-top" alt="Product">
                <div class="card-body text-center">
                    <h5 class="card-title">Bluetooth Speaker</h5>
                    <p class="text-success fw-bold">₹2,499</p>
                    <button class="btn btn-primary">Buy Now</button>
                </div>
            </div>
        </div>

        <div class="col-md-3 col-6">
            <div class="card h-100 shadow">
                <img src="headphone.jpg" class="card-img-top" alt="Product">
                <div class="card-body text-center">
                    <h5 class="card-title">Headphones</h5>
                    <p class="text-success fw-bold">₹1,499</p>
                    <button class="btn btn-primary">Buy Now</button>
                </div>
            </div>
        </div>
        
        <div class="col-md-3 col-6">
            <div class="card h-100 shadow">
                <img src="Wireless-Mouse.jpg"class="card-img-top" alt="Product">
                <div class="card-body text-center">
                    <h5 class="card-title">Wireless Mouse</h5>
                    <p class="text-success fw-bold">₹799</p>
                    <button class="btn btn-primary">Buy Now</button>
                </div>
            </div>
        </div>

    </div>

</div>

</body>
</html>
