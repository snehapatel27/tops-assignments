<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Playlist</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <h2 class="text-center text-danger mb-4">Featured Playlists</h2>
    <div class="row">
        <div class="col-md-4 mb-4">
            <div class="card h-100 shadow">
                <img src="Arijit.jpg" class="card-img-top" alt="Playlist">
                <div class="card-body text-center">
                    <h4 class="card-title">Top Hits</h4>
                    <button class="btn btn-success">Listen Now</button>
                </div>
            </div>
        </div>
        
        <div class="col-md-4 mb-4">
            <div class="card h-100 shadow">
                <img src="RomanticHits.jpg" class="card-img-top" alt="Playlist">
                <div class="card-body text-center">
                    <h4 class="card-title">Romantic Songs</h4>
                    <button class="btn btn-success">Listen Now</button>
                </div>
            </div>
        </div>
        
        <div class="col-md-4 mb-4">
            <div class="card h-100 shadow">
                <img src="workout.jpg" class="card-img-top" alt="Playlist">
                <div class="card-body text-center">
                    <h4 class="card-title">Workout Mix</h4>
                    <button class="btn btn-success">Listen Now</button>
                </div>
            </div>
        </div>

    </div>

</div>

</body>
</html>
