<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookMyShow Carousel</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background-color:#f5f5f5;
        }

        .carousel-item img{
            height:700px;
            object-fit:cover;
        }

        .carousel-caption{
            background:rgba(0,0,0,0.6);
            border-radius:10px;
            padding:10px;
        }
    </style>
</head>
<body>

<div class="container mt-5">

    <h2 class="text-center mb-4">Featured Movies</h2>

    <div id="movieCarousel" class="carousel slide" data-bs-ride="carousel">

        
        <div class="carousel-indicators">
            <button type="button" data-bs-target="#movieCarousel" data-bs-slide-to="0" class="active"></button>
            <button type="button" data-bs-target="#movieCarousel" data-bs-slide-to="1"></button>
            <button type="button" data-bs-target="#movieCarousel" data-bs-slide-to="2"></button>
        </div>
        
        <div class="carousel-inner">
            
            <div class="carousel-item active">
                <img src="movie-3.jpg"
                     class="d-block w-100"
                     alt="Movie 1">

                <div class="carousel-caption">
                    <h4>Avengers: Endgame</h4>
                    <p>Marvel Superhero Action Movie</p>
                </div>
            </div>
            
            <div class="carousel-item">
                <img src="s.jpg"
                     class="d-block w-100"
                     alt="Movie 2">

                <div class="carousel-caption">
                    <h4>Spider-Man</h4>
                    <p>Adventure and Action</p>
                </div>
            </div>
            
            <div class="carousel-item">
                <img src="kgf.jpg"
                     class="d-block w-100"
                     alt="Movie 3">

                <div class="carousel-caption">
                    <h4>KGF Chapter 2</h4>
                    <p>Action Drama Movie</p>
                </div>
            </div>

        </div>
        
        <button class="carousel-control-prev"
                type="button"
                data-bs-target="#movieCarousel"
                data-bs-slide="prev">

            <span class="carousel-control-prev-icon"></span>

        </button>
        
        <button class="carousel-control-next"
                type="button"
                data-bs-target="#movieCarousel"
                data-bs-slide="next">

            <span class="carousel-control-next-icon"></span>

        </button>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
