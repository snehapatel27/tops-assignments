<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flipkart Product Card</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background-color:#f1f3f6;
        }

        .card{
            width:300px;
            margin:50px auto;
            transition:0.3s;
        }

        .card:hover{
            transform:scale(1.03);
            box-shadow:0 5px 15px rgba(0,0,0,0.2);
        }

        .card img{
            height:220px;
            object-fit:contain;
            padding:15px;
        }

        .price{
            color:green;
            font-size:22px;
            font-weight:bold;
        }

        .btn-buy{
            width:100%;
        }
    </style>
</head>
<body>

<div class="card">
    
    <img src="bluetooth.jpg" class="card-img-top" alt="Product">
    
    <div class="card-body">
        
        <h5 class="card-title">
            Wireless Bluetooth Headphones
        </h5>
        
        <p class="price">
            ₹1,999
        </p>
        
        <button class="btn btn-warning btn-buy">
            Buy Now
        </button>

    </div>

</div>

</body>
</html>
