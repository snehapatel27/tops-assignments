<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Links Form</title>
    
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="style2.css">
</head>
<body>

<div class="container">

    <h2>Social Links</h2>

    <div class="input-box">
        <i class="fa-brands fa-instagram"></i>
        <input type="text" placeholder="Enter Instagram Link">
    </div>

    <div class="input-box">
        <i class="fa-brands fa-linkedin"></i>
        <input type="text" placeholder="Enter LinkedIn Link">
    </div>

    <div class="input-box">
        <i class="fa-brands fa-discord"></i>
        <input type="text" placeholder="Enter Discord Link">
    </div>

    <div class="input-box">
        <i class="fa-brands fa-github"></i>
        <input type="text" placeholder="Enter GitHub Link">
    </div>

    <button>Save Links</button>

</div>

</body>
</html>
