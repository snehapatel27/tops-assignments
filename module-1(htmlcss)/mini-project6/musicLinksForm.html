<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Links Form</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    h2 class="text-center mb-4">Music Links Form</h2>
    
    <form id="musicLinksForm">
        <div class="mb-3">
            <label class="form-label">Spotify Profile URL</label>
            <input type="url" class="form-control" placeholder="Enter Spotify URL">
        </div>

        <div class="mb-3">
            <label class="form-label">YouTube Music URL</label>
            <input type="url" class="form-control" placeholder="Enter YouTube Music URL">
        </div>

        <div class="mb-3">
            <label class="form-label">Apple Music URL</label>
            <input type="url" class="form-control" placeholder="Enter Apple Music URL">
        </div>

        <button class="btn btn-primary">
            Submit
        </button>
    </form>
    <hr>

    <h3 class="mb-3">Preview Cards</h3>

    <div class="row">

        <div class="col-md-4">
            <div class="card shadow">
                <div class="card-body">
                    <h5 class="text-success">Spotify</h5>
                    <p>https://spotify.com/artist</p>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow">
                <div class="card-body">
                    <h5 class="text-danger">YouTube Music</h5>
                    <p>https://music.youtube.com</p>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow">
                <div class="card-body">
                    <h5 class="text-secondary">Apple Music</h5>
                    <p>https://music.apple.com</p>
                </div>
            </div>
        </div>

    </div>

</div>

</body>
</html>
