<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Spacing Utilities</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">

    <h2 class="text-center mb-4">Bootstrap Spacing Utilities Example</h2>

    <div class="row justify-content-center">

        <!-- Card 1 -->
        <div class="col-md-3">
            <div class="card m-2 p-2 text-center shadow-sm">
                <img src="headphone.jpg"
                     class="card-img-top"
                     alt="Headphones">
                <div class="card-body">
                    <h5 class="card-title">Wireless Headphones</h5>
                </div>
            </div>
        </div>

        <!-- Card 2 -->
        <div class="col-md-3">
            <div class="card m-4 p-4 text-center shadow">
                <img src="phone.jpg"
                     class="card-img-top"
                     alt="Smartphone">
                <div class="card-body">
                    <h5 class="card-title">Smartphone</h5>
                </div>
            </div>
        </div>

        <!-- Card 3 -->
        <div class="col-md-3">
            <div class="card m-5 p-5 text-center shadow-lg">
                <img src="shose1.jpg"
                     class="card-img-top"
                     alt="Shoes">
                <div class="card-body">
                    <h5 class="card-title">Sports Shoes</h5>
                </div>
            </div>
        </div>

    </div>

</div>

</body>
</html>
