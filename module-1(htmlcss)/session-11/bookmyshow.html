<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Review Card</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow mx-auto" style="width: 22rem;">
        
        <img src="pushpa.jpg"
             class="card-img-top"
             alt="Movie Poster">

        <div class="card-body">
            
            <h2 class="card-title fs-3 fw-bold">
                Pushpa 2
            </h2>
            
            <p class="fs-5 fw-semibold text-warning">
                ⭐ 4.8/5
            </p>
            
            <p class="card-text fs-6 fw-normal text-muted">
                Pushpa 2 is an action-packed movie with excellent performances,
                amazing background music, and thrilling fight scenes.
                A must-watch for action lovers!
            </p>
           
            <a href="#" class="btn btn-danger w-100">
                Book Now
            </a>

        </div>
    </div>
</div>

</body>
</html>
