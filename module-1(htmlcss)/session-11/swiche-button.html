<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theme Switcher</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div id="main" class="container mt-5 p-5 bg-light text-dark rounded shadow text-center">

    <h2>Movie Booking</h2>
    <p>Book your favorite movie tickets online.</p>

    <button class="btn btn-primary" onclick="changeTheme()">
        Switch Theme
    </button>

</div>

<script>
function changeTheme() {
    let box = document.getElementById("main");

    box.classList.toggle("bg-light");
    box.classList.toggle("bg-dark");

    box.classList.toggle("text-dark");
    box.classList.toggle("text-light");
}
</script>

</body>
</html>
