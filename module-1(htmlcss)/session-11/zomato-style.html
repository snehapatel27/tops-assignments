<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zomato Restaurant Card</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .card img{
    height: 300px;
    object-fit: cover;
}
    </style>
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row g-4">
        
        <div class="col-md-4">
            <div class="card shadow">
                <img src="spice vill.jpg"
                     class="card-img-top" alt="Restaurant">

                <div class="card-body">
                    <h4 class="card-title">Spice Villa</h4>
                    <span class="badge bg-success">⭐ 4.5</span>
                    <span class="badge bg-warning text-dark">20% OFF</span>
                    <hr>
                    <p class="text-success fw-bold">` Open Now</p>
                    <button class="btn btn-danger w-100">
                        Order Now
                    </button>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow">
                <img src="piza hut.jpg"
                     class="card-img-top" alt="Restaurant">

                <div class="card-body">
                    <h4 class="card-title">Pizza Hub</h4>
                    <span class="badge bg-primary">⭐ 4.2</span>
                    <span class="badge bg-info text-dark">Buy 1 Get 1</span>
                    <hr>
                    <p class="text-danger fw-bold">Closed</p>
                    <button class="btn btn-secondary w-100">
                        View Menu
                    </button>
                </div>
            </div>
        </div>
    
        <div class="col-md-4">
            <div class="card shadow">
                <img src="burgerpoint.jpg"
                     class="card-img-top" alt="Restaurant">

                <div class="card-body">
                    <h4 class="card-title">Burger Point</h4>
                    <span class="badge bg-success">⭐ 4.8</span>
                    <span class="badge bg-danger">Flat 50% OFF</span>
                    <hr>
                    <p class="text-success fw-bold"> Open</p>

                    <button class="btn btn-danger w-100">
                        Order Now
                    </button>
                </div>
            </div>
        </div>

    </div>
</div>

</body>
</html>
