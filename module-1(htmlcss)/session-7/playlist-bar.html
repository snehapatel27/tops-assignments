<!DOCTYPE html>
<html>
<head>
<title>Spotify Playlist Bar</title>

<style>

.playlist-bar{
    display: flex;
    gap: 40px;
    background-color: #155014;
    padding: 20px;
    align-items: center;
}

.song-card{
    height: 100px;
    width: 180px;
    background-color: #d83f18;
    color: white;
    border-radius: 10px;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

</style>

</head>

<body>

<h1>Spotify Playlist</h1>

<section class="playlist-bar">

    <article class="song-card">
        <h3>Agar Tum Saath Ho</h3>
        <p>Arijit Singh</p>
    </article>

    <article class="song-card">
        <h3>Khairiyat</h3>
        <p>Arijit Singh</p>
    </article>

    <article class="song-card">
        <h3>Kesariya</h3>
        <p>Arijit Singh</p>
    </article>


    <article class="song-card">
        <h3>Shape Of You</h3>
        <p>Ed Sheeran</p>
    </article>

    <article class="song-card">
        <h3>Apna Bana Le</h3>
        <p>Arijit Singh</p>
    </article>
</section>

</body>
</html>
