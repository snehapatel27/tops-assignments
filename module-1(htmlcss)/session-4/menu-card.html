<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zomato</title>
    <style>
        .box{
            height: 300px;
            width: 300px;
            border: 2px solid black; 
            border-radius: 20px;
            flex-direction: column;
            display: inline-flex;
            margin: 40px;
                   
      }
      header{
         background-color:   rgb(182, 216, 244);
        height: 50px;
        font-family: sans-serif;
        color: white;
          font-weight: bolder;
          font-size:larger;
       
          border-top-left-radius: 20px;
         border-top-right-radius: 20px;
         overflow: hidden;
         display: flex;
         justify-content:center;
         align-items: center;
}
    .h1{
        background-color: rgb(211, 240, 168);
        height: 50px;
        font-family: sans-serif;
        color: white;
          font-weight: bolder;
          font-size:larger;
       
          border-top-left-radius: 20px;
         border-top-right-radius: 20px;
         overflow: hidden;
         display: flex;
         justify-content:center;
         align-items: center;
        }
        .h2{
        background-color: rgb(183, 159, 238);
        height: 50px;
        font-family: sans-serif;
        color: white;
          font-weight: bolder;
          font-size:larger;
       
          border-top-left-radius: 20px;
         border-top-right-radius: 20px;
         overflow: hidden;
         display: flex;
         justify-content:center;
         align-items: center;
        }

        footer{
            background-color:   rgb(182, 216, 244);
            height: 40px;
            font-weight: bolder;
            color: white;
            display: flex;
              justify-content: space-between;
             align-items: center;
            padding: 0 15px;
             border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            overflow: hidden;
        }
        .f1{
            
            background-color:  rgb(211, 240, 168);
            height: 40px;
            font-weight: bolder;
            color: white;
            display: flex;
              justify-content: space-between;
             align-items: center;
            padding: 0 15px;
             border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            overflow: hidden;
        }
        .f2{
            
            background-color:  rgb(183, 159, 238);
            height: 40px;
            font-weight: bolder;
            color: white;
            display: flex;
              justify-content: space-between;
             align-items: center;
            padding: 0 15px;
             border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            overflow: hidden;
        }
        footer p{
            margin: 0;
        }
        ul li{
            list-style-type: none;
        }
        article{
            flex: 1;
            margin: 50px;
             }
             article li{
                margin: 10px;
             }
    </style>
</head>
<body>
    <div class="box">
        <header>Jalaram kathiyawadi</header>
<article>

    <ul>
        <li>gujrati thali</li>
        <li>panjabi thali</li>
        <li>chainess</li>
    </ul>  
</article>
<footer>
    <p>4.0* </p>
    <p>30min</p>
</footer>
 </div>
 <div  class="box">
        <header class="h1">Tea Post</header>
            <article>

                <ul>
                    <li>Tea </li>
                    <li>Coffee</li>
                    <li>Sandwich</li>
                </ul>  
            </article>
        <footer class="f1">
            <p>3.5* </p>
            <p>25min</p>
        </footer>
    </div>
        
    <div class="box">
        <header class="h2">lapino's Pizza</header>
<article>

    <ul>
        <li>Cheese & Herb Pizza</li>
        <li>Tomatoes Pizza</li>
        <li>Garlic-to-pizza Pizza </li>
    </ul>  
</article>
<footer class="f2">
    <p>4.5* </p>
    <p>20min</p>
</footer>
    </div>
</body>
</html>
