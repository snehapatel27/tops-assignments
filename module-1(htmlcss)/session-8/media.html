    <title>flipcart card</title>
    <style>
        .main{
            display: flex;
            gap: 30px;

        }
        .product{
            height: 500px;
            width: 500px;
            border: 1px solid black;
            border-radius: 30px;
            
        }
        .product img {
            height: 350px;
            width: 500px ;
            border-top-left-radius: 40px;
             border-top-right-radius: 40px;
        }
        h2{
            padding-left: 20px;
        }

       

        @media only screen and (max-width: 1200px) {
    .product {
        font-size: 50px;
        padding: 25px;
    }
}

@media only screen and (max-width: 900px) {
    .product {

        padding: 20px;
    }
}

@media only screen and (max-width: 600px) {
    .product {
        font-size: 15px;
        padding: 10px;
    }
}
       
    </style>
</head>
